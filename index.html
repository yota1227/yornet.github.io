<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yornet · Challenge Writeups</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#050507;color:#d6d3d8}
    #status{font:16px/1.5 system-ui,sans-serif;max-width:38rem;margin:15vh auto;padding:1.5rem;color:#d6d3d8}
    a{color:#b5b3bb}
  </style>
</head>
<body>
  <p id="status">Restoring Yornet…</p>
  <script>
    // Load the last complete, working app snapshot. Inject it into this document
    // (rather than an iframe) so existing site-origin localStorage writeups remain available.
    const snapshot = 'https://cdn.jsdelivr.net/gh/yota1227/yornet.github.io@786a8f7153968ec18c020bea7f042d3cc7c8539c/index.html';
    fetch(snapshot)
      .then(response => {
        if (!response.ok) throw new Error(`Could not load the restored app (${response.status})`);
        return response.text();
      })
      .then(html => {
        const fontFix = `<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>textarea,.md code,pre code{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}.md code,pre code{font-size:14px;line-height:1.5}</style>`;
        document.open();
        document.write(html.replace('</head>', `${fontFix}</head>`));
        document.close();
      })
      .catch(error => {
        document.getElementById('status').innerHTML = `Could not load the restored writeup app. <a href="${snapshot}">Open the saved working version</a>.`;
        console.error(error);
      });
  </script>
</body>
</html>
