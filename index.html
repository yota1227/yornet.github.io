<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yornet · Challenge Writeups</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ico:url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eH[...]
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#8a122412,transparent),radial-gradient(800px 500px at 100% 100%,#8a12240d,transparent),var(--bg);color:var(--tx);font:17px/1.6 'Cormorant Garamond',serif}
#bg{position:fixed;inset:0;pointer-events:none;transition:opacity .2s}
#scene,#shape{position:fixed;inset:0;pointer-events:none}
#scene{background:linear-gradient(#050507b3 0,#050507c4 55%,#050507f0 100%),var(--hero) 65% center/cover;filter:grayscale(.55) brightness(.62) contrast(1.05);transition:opacity .2s}
#shape{opacity:.45;transition:opacity .2s}#shape svg{width:100%;height:100%}
header,main,footer{position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:#050507dd;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#050507dd;z-index:30}
#lg,#lg2{width:40px;height:40px;border-radius:50%;flex:none;border:1px solid var(--ln);background:var(--ico) center/cover}
.logo{display:flex;align-items:center;gap:8px;font:500 16px Cinzel,serif;color:var(--tx);text-decoration:none;letter-spacing:.06em}
nav{display:flex;gap:4px;margin-left:auto}
nav a{color:var(--dim);text-decoration:none;padding:6px 12px;border-radius:8px;font:400 12px Cinzel,serif;letter-spacing:.08em;text-transform:uppercase}
nav a:hover,nav a.on{color:var(--tx);background:var(--p2);box-shadow:inset 0 -2px var(--red)}
main{max-width:1000px;margin:0 auto;padding:24px 18px 60px}
h1,h2,h3{font-family:Cinzel,serif;line-height:1.2;margin:.4em 0}
.hero{text-align:center;padding:90px 0 40px}
.hero h1{filter:drop-shadow(0 2px 12px #000c)}.hero .sub{color:#c2bfc4;text-shadow:0 1px 10px #000}
.hero h1{font-size:clamp(30px,6vw,52px);margin:.2em 0;background:linear-gradient(90deg,#dcd8dc,var(--red2),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.08em}
.sub{color:var(--dim);font-style:italic;max-width:560px;margin:0 auto 20px}
.stats{display:flex;justify-content:center;gap:30px;margin-top:26px;flex-wrap:wrap}
.stats b{display:block;font:500 26px Cinzel,serif;color:var(--blue2)}.stats span{color:var(--dim);font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.thread{height:2px;margin:18px 0;background:linear-gradient(90deg,transparent,var(--red2),#b9b6bb,transparent)}
.sec{font-size:18px;margin:30px 0 12px;letter-spacing:.08em}.sec::after{content:"";display:block;width:70px;height:2px;margin-top:6px;background:linear-gradient(90deg,var(--red2),var(--red),var(--blue))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:block;background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:12px;padding:16px;color:var(--tx);text-decoration:none;transition:.2s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--red2),var(--red),var(--blue))}
.card:hover{transform:translateY(-3px);border-color:var(--blue)}
.card h3{font-size:15px;margin:8px 0}.cat{text-align:center}.ico{font-size:24px;color:var(--red2)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.c{justify-content:center}.sb{justify-content:space-between}
.dim{color:var(--dim)}.sm{font-size:14px}
.badge{font:400 11px Cinzel,serif;letter-spacing:.1em;text-transform:uppercase;padding:2px 10px;border-radius:99px;background:#8a122433;color:var(--red2);border:1px solid #8a122477}
.diff{font-size:13px}.pts{color:#b86a74;font-size:13px;display:inline-flex;align-items:center;gap:4px}.sc{display:flex;align-items:center;gap:8px}.sc svg{flex:none}.d-Easy{color:var(--blue2)}.d-Medium{color:var(--red2)}.d-Hard{color:#b86a74}.d-Insane{color:#d58966}
.tag{color:var(--blue2);font-size:15px;margin-right:10px}
.btn{font:400 12px Cinzel,serif;letter-spacing:.06em;padding:9px 18px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.25)}.btn.red{background:linear-gradient(var(--red),#4a0a16);border-color:var(--red2)}.btn.blue{background:linear-gradient(var(--blue),#3a0a14);border-color:var(--blue2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:4px 14px;border-radius:99px;border:1px solid var(--ln);color:var(--dim);text-decoration:none;font-size:15px;cursor:pointer}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
input,select,textarea{width:100%;background:#08080b;border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:8px 10px;font:16px 'Cormorant Garamond',serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{min-height:260px;font:14px/1.5 'JetBrains Mono',ui-monospace,Consolas,monospace;resize:vertical}
label{display:block;font-size:13px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 4px}
.read h1{font-size:clamp(24px,4vw,34px)}
.md h2{color:var(--red2);font-size:20px;margin-top:1.4em}.md h3{color:var(--blue2)}.md h4{color:var(--dim)}
.md a{color:var(--blue2)}
.md code, pre code{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:14px;line-height:1.5}
.md code{background:#1c1c24;padding:1px 6px;border-radius:5px;color:#cdcad0}
pre{position:relative;background:#040405;border:1px solid var(--ln);border-left:3px solid var(--red);border-radius:8px;padding:14px;overflow-x:auto}pre code{background:none;padding:0}
.lang{position:absolute;right:10px;top:4px;font-size:11px;letter-spacing:.1em;color:var(--blue2);text-transform:uppercase}
blockquote{margin:12px 0;padding:4px 16px;border-left:3px solid var(--blue);color:var(--dim);font-style:italic}
hr{border:0;height:1px;background:var(--ln)}
.call{padding:10px 14px;border-radius:8px;margin:12px 0;border:1px solid;border-left-width:4px}.call b{text-transform:uppercase;font:500 11px Cinzel,serif;letter-spacing:.12em;margin-right:8px}
.note{background:#b5b3bb1a;border-color:#b5b3bb}.tip{background:#8a12242e;border-color:#8a1224}.warn{background:#b5384b26;border-color:#b5384b}.danger{background:linear-gradient(90deg,#a8052f3d,#8a122433);border-color:#a8052f}
.c-red,.c-pink{color:var(--red2);font-weight:600}.c-white{color:#dcd8dc;font-weight:600}.c-gray{color:#77757d;font-weight:600}.c-purple{color:#b86a74;font-weight:600}.c-blue{color:var(--blue2);font-weight:600}.c-green{color:#7db08d;font-weight:600}
figure{margin:16px 0;text-align:center}figure img{max-width:100%;border-radius:10px;border:1px solid var(--ln)}figcaption{color:var(--dim);font-size:14px}
.flag{margin:18px 0;padding:12px 16px;border-radius:10px;border:1px dashed var(--red2);background:linear-gradient(90deg,#8a122422,#6a102222);font-size:17px}
.flag.blur{cursor:pointer;border-color:#a8052f}.flag.blur code{filter:blur(7px)}.flag em{color:var(--dim);margin-left:10px;font-size:14px}
.modal{position:fixed;inset:0;background:#000c;display:flex;justify-content:center;align-items:flex-start;overflow:auto;z-index:50;padding:20px 12px}.modal[hidden]{display:none}
.box{background:var(--p);border:1px solid var(--ln);border-radius:14px;max-width:780px;width:100%;padding:20px;box-shadow:0 10px 40px #000a}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.tb{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tb button{padding:3px 10px;font-size:13px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;cursor:pointer}.tb .sw{width:24px;height:24px;border-radius:50%;border:2px solid #ffffff44;padding:0}.tb .sw:hover{transform:scale(1.18)}
.x{background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:16px}td{padding:7px 10px;border-bottom:1px solid var(--ln);vertical-align:top}td:first-child{white-space:nowrap}
.step{display:flex;gap:14px;margin:12px 0}.step i{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:500 14px Cinzel,serif;font-style:normal;background:linear-gradient(135deg,var(--red2),var(--red),var(--blue));color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--blue);padding:8px 18px;border-radius:99px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
footer{text-align:center;color:var(--dim);font-size:14px;padding:20px}

#sp{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;z-index:40;background:linear-gradient(90deg,var(--red2),var(--red),var(--blue))}
#ov{position:fixed;inset:0;background:#000a;z-index:60;opacity:0;pointer-events:none;transition:.25s}#ov.on{opacity:1;pointer-events:auto}
#sb{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:70;background:linear-gradient(180deg,#16161c,#09090c);border-right:1px solid var(--ln);box-shadow:8px 0 30px #000a;transform:translateX(-105%);transition:.25s;display:flex;flex-direction:column;padding:14px 14px 18px;gap:8px}#sb.open{transform:none}
#sb a{display:block;padding:10px 14px;border-radius:10px;color:var(--tx);text-decoration:none;font:500 13px Cinzel,serif;letter-spacing:.06em;border:1px solid transparent}
#sb a small{display:block;font:italic 15px 'Cormorant Garamond',serif;color:var(--dim);letter-spacing:0}
#sb a:hover,#sb a.on{background:var(--p2);border-color:var(--ln);box-shadow:inset 3px 0 var(--red2)}
.sbh{display:flex;align-items:center;gap:10px}
.av{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:500 20px Cinzel,serif;background:linear-gradient(135deg,var(--red2),var(--red),var(--blue))}
.rk{color:#b86a74;font-size:14px;letter-spacing:.08em;text-transform:uppercase}.auth p{margin:12px 0}
.st{display:flex;gap:18px;margin:8px 0}.st b{display:block;font:500 17px Cinzel,serif;color:var(--blue2)}.st span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.silk{height:6px;border-radius:99px;background:#1c1c24;overflow:hidden;margin:10px 0 4px}.silk i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red),var(--blue))}
.sp{background:#a8052f;color:transparent;border-radius:4px;cursor:pointer;padding:0 4px;transition:.25s}.sp.on{background:#a8052f33;color:inherit;box-shadow:none}
#cp{width:34px;height:28px;padding:0;border:0;background:none;cursor:pointer}
.tw{overflow-x:auto;margin:12px 0}.tbl th{background:#8a122433;text-align:left;padding:7px 10px;font:500 12px Cinzel,serif;letter-spacing:.05em;border-bottom:2px solid var(--red2)}.tbl td:first-child{white-space:nowrap}
.md ol,.md ul{padding-left:24px}.md u{text-decoration-color:var(--red2)}
h1,h2,h3{font-weight:500}main h1,.sec,.card h3,.step h3{text-transform:uppercase;letter-spacing:.07em}.md h2,.md h3,.md h4{text-transform:none;letter-spacing:.03em}
</style></head><body>
